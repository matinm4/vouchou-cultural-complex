<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مجتمع فرهنگی ووچو، گچساران — ارائه سه‌بعدی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/presentation.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <!-- صفحه بارگذاری -->
  <div id="loader">
    <div class="loader-cubes"><i></i><i></i><i></i><i></i></div>
    <div class="loader-word">ووچو</div>
    <div class="loader-latin">VOUCHOU</div>
    <button id="startBtn">شروع ارائه</button>
  </div>

  <!-- سربرگ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><i></i><i></i><i></i></span>
      <span class="brand-text">ووچو <small>VOUCHOU</small></span>
    </div>
    <div class="counter"><b id="cur">01</b><span>/</span><span id="tot">16</span></div>
  </header>

  <!-- محل اسلاید -->
  <main id="stage"></main>

  <!-- نوار پیشرفت -->
  <div class="progress"><div id="bar"></div></div>

  <!-- کنترل‌ها -->
  <nav class="dock">
    <button data-act="prev" title="قبلی (→)">›</button>
    <button data-act="play" id="playBtn" title="پخش خودکار (P)">▶</button>
    <button data-act="next" title="بعدی (←)">‹</button>
    <span class="sep"></span>
    <button data-act="night" id="nightBtn" title="روز / شب (N)">☾</button>
    <button data-act="xray" id="xrayBtn" title="حالت دیاگرام (X)">◩</button>
    <button data-act="orbit" id="orbitBtn" title="گردش آزاد (O)">⟳</button>
    <button data-act="hide" id="hideBtn" title="نمایش فقط مدل (H)">◎</button>
    <span class="sep"></span>
    <button data-act="grid" title="فهرست اسلایدها (G)">▦</button>
    <a href="sheets.html" target="_blank" title="مشاهده و دانلود دو شیت معماری" style="display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;color:var(--gold);text-decoration:none;font-size:18px;transition:all .25s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='transparent'">📋</a>
    <button data-act="full" title="تمام صفحه (F)">⛶</button>
  </nav>

  <!-- فهرست اسلایدها -->
  <div id="grid" class="overlay"><div class="grid-inner"></div></div>

  <!-- بزرگنمایی تصویر -->
  <div id="lightbox" class="overlay"><img alt="" /><span class="lb-hint">برای بستن کلیک کنید</span></div>

  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/OrbitControls.js"></script>
  <script src="js/slidesData.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
